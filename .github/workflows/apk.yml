name: Costruisci APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Strumenti Android
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "::error::Strumenti Android non trovati sul sistema di costruzione"; exit 1; fi
          echo "sdk.dir=$SDK" > android/local.properties
          echo "Android SDK: $SDK"

      - name: Installa le dipendenze
        run: npm ci

      - name: Prepara la pagina e il progetto Android
        run: npm run sync

      - name: Costruisci l'APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # le righe di errore diventano annotazioni leggibili nella pagina della costruzione
            grep -E "What went wrong|error:|FAILURE|Could not|> " build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            tail -40 build.log
          fi
          exit $code

      - name: Rinomina l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk deck-lab-bbx.apk

      - uses: actions/upload-artifact@v4
        with:
          name: deck-lab-bbx-apk
          path: deck-lab-bbx.apk

      - name: Pubblica nella pagina di download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTE="Ultima versione di Deck Lab BBX per Android (costruzione n. ${{ github.run_number }}).

          Scarica deck-lab-bbx.apk qui sotto e aprilo sul telefono. Se Android lo chiede, consenti l'installazione di app da questa origine."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest deck-lab-bbx.apk --clobber
            gh release edit latest --title "Deck Lab BBX" --notes "$NOTE" --latest
          else
            gh release create latest deck-lab-bbx.apk --title "Deck Lab BBX" --notes "$NOTE" --latest
          fi
