<body>
<title>Deck Lab BBX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco da officina. Testata fissa con le schede, colonna unica larga 960px, pannelli a griglia che si impilano su telefono. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e6eaef; --ink:#12161c; --muted:#5b6673; --line:#d4dae2;
  --accent:#d9501a; --accent-ink:#ffffff; --accent-soft:#fbe3d8;
  --good:#1d7f47; --bad:#b8372b; --warn:#9a6512;
  --f-display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#171c23; --sunk:#11161c; --ink:#e7ecf2; --muted:#93a0ad; --line:#2a323c;
  --accent:#ff7a3d; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --good:#46c27a; --bad:#f07264; --warn:#e3a744; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#171c23; --sunk:#11161c; --ink:#e7ecf2; --muted:#93a0ad; --line:#2a323c;
  --accent:#ff7a3d; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --good:#46c27a; --bad:#f07264; --warn:#e3a744; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;min-width:0}
.burger{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none}
.burger[aria-expanded="true"]{background:var(--sunk)}
.brand svg{flex:none}
.sync{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:45%}
nav{display:grid;gap:2px;padding-block:4px 10px;border-top:1px solid var(--line)}
nav[hidden]{display:none}
nav button{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-left:3px solid transparent;color:var(--muted);padding:11px 12px;text-align:left;cursor:pointer;border-radius:0 6px 6px 0}
nav button:hover{background:var(--sunk)}
nav button[aria-selected="true"]{color:var(--ink);border-left-color:var(--accent);background:var(--sunk)}
main{padding-block:24px 64px;display:grid;gap:24px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:24px;font-weight:700}
h3{font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.stack{display:grid;gap:10px}
button.btn,a.btn{font:600 14px var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.btn.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
button.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:110px;font-family:var(--f-mono);font-size:13px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chip{display:inline-block;font:500 12px var(--f-mono);padding:2px 7px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.bad{color:var(--bad)}
.chip.good{color:var(--good)}
.chip.warn{color:var(--warn)}

/* Deck */
.deck-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.score-big{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.combo{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface);min-width:0}
.combo .slot{font:600 12px var(--f-mono);color:var(--accent)}
.combo .name{font:700 19px/1.2 var(--f-display)}
.combo .code{font:500 15px var(--f-mono);color:var(--muted)}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar i{display:block;height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar span:last-child{text-align:right;font-family:var(--f-mono);color:var(--ink)}
.alt{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.alt:first-child{border-top:0}
.ai-out{background:var(--sunk);border-radius:8px;padding:14px;display:grid;gap:10px;font-size:14px}
.ai-out ul{margin:0;padding-left:18px}
.msg{display:grid;gap:2px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);max-width:100%;overflow-wrap:anywhere}
.msg.user{background:var(--accent-soft);border-color:transparent}

/* Tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{padding:5px 7px;font-size:13px}
td input.qty{width:56px}
tr.off td{opacity:.55}
.rank{display:grid;grid-template-columns:30px 1fr 44px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.rank .r{font:500 12px var(--f-mono);color:var(--muted)}
.rank .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.rank .nm i{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.rank .nm i b{display:block;height:100%;background:var(--line)}
.rank.own .nm i b{background:var(--accent)}
.rank.own .nm span{font-weight:600}
.rank .s{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stat{display:grid;gap:2px}
.stat b{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
@media (prefers-reduced-motion: no-preference){.bar i b,.rank .nm i b{transition:width .4s ease}}
@media (max-width:520px){h2{font-size:21px}.score-big{font-size:34px}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <button type="button" class="burger" id="burger" aria-expanded="false" aria-controls="menu" aria-label="Apri il menu delle sezioni">

<script>

const PERIOD_LABEL = {year:"ultimo anno", month:"ultimo mese", week:"ultima settimana", all:"tutto lo storico"};

const TYPO = {supresssuperion:"suppresssuperion", aeropegaus:"aeropegasus", weedge:"wedge", points:"point", bulletgryphon:"bulletgriffin", bahamablitz:"bahamutblitz", rockgolem:"golemrock", freeball:"freeball"};

function emptyState(){ return {v:1, parts:[], results:[], decks:[], meta:null, live:null, settings:{bitTypeLimit:false, personalWeight:50, challonge:"", slots:[{},{},{}]}} }
function normState(x){
  const s = Object.assign(emptyState(), x||{});
  s.settings = Object.assign(emptyState().settings, s.settings||{});
  s.parts = Array.isArray(s.parts)?s.parts:[]; s.results = Array.isArray(s.results)?s.results:[]; s.decks = Array.isArray(s.decks)?s.decks:[]; s.trainLog = Array.isArray(s.trainLog)?s.trainLog:[];

  delete s.settings.lockBlades;
  return s;
}
const uid = () => Math.random().toString(36).slice(2,10);
const esc = v => String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- Salvataggio ----------
let db=null, docRef=null, timer=null, writing=false, again=false, dirtyAt=0;
const LS_KEY = "decklab-bbx-state";
function lsGet(){ try{ const t=localStorage.getItem(LS_KEY); return t?JSON.parse(t):null }catch(e){ return null } }
function lsSet(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)) }catch(e){} }

// ---------- Salvataggio con unione delle modifiche ----------

let synced=null;
const LISTS=["parts","results","decks","trainLog"], SINGLES=["settings","meta","live","train"];
function snapshotMap(st){ const m=new Map(); for(const k of LISTS) (st[k]||[]).forEach(x=>m.set(k+":"+x.id, JSON.stringify({...x,u:undefined}))); for(const k of SINGLES) m.set(k, JSON.stringify(st[k]??null)); return m }
function stamp(){
  const now=Date.now(), cur=snapshotMap(S); S.uts=S.uts||{}; S.del=S.del||{};
  if(synced){
    // una modifica fatta qui vale sempre più della versione da cui parte, anche se l'orologio è indietro
    for(const k of LISTS) (S[k]||[]).forEach(x=>{ const key=k+":"+x.id; if(synced.get(key)!==cur.get(key)) x.u=Math.max(now,(+x.u||0)+1) });
    for(const k of SINGLES) if(synced.get(k)!==cur.get(k)) S.uts[k]=Math.max(now,(+S.uts[k]||0)+1);
    for(const key of synced.keys()) if(key.includes(":") && !cur.has(key)) S.del[key]=now;
  }
  synced=cur;
}
function mergeStates(a,b){ // a = copia online, b = copia di questa pagina
  a=a||{}; const del={...(a.del||{})}; for(const [k,v] of Object.entries(b.del||{})) del[k]=Math.max(del[k]||0,v);
  const out={...b};
  for(const k of LISTS){
    const m=new Map(), order=[];
    for(const x of (b[k]||[])){ m.set(x.id,x); order.push(x.id) }
    for(const x of (a[k]||[])){ const y=m.get(x.id); if(!y){ m.set(x.id,x); order.push(x.id) } else if((+x.u||0)>(+y.u||0)) m.set(x.id,x) }
    out[k]=order.map(id=>m.get(id)).filter(x=>!((del[k+":"+x.id]||0)>=(+x.u||0) && del[k+":"+x.id]));
  }
  const ua=a.uts||{}, ub=b.uts||{}; out.uts={};
  for(const k of SINGLES){ if((+ua[k]||0)>(+ub[k]||0)){ out[k]=a[k]; out.uts[k]=ua[k] } else { out[k]=b[k]; out.uts[k]=+ub[k]||0 } }
  const cut=Date.now()-60*864e5; out.del={}; for(const [k,v] of Object.entries(del)) if(v>cut) out.del[k]=v;
  return normState(JSON.parse(JSON.stringify(out)));
}
function save(){
  stamp(); lsSet(); dirtyAt = Date.now();
  if(!docRef || readOnly){ setSync(docRef?"sola lettura":"salvato su questo dispositivo"); return }
  setSync("modifiche in attesa…");
  clearTimeout(timer); timer=setTimeout(flush, 900);
}
async function flush(){
  if(writing){ again=true; return }
  writing=true;
  try{
    // prima di scrivere unisco quello che c'è online, così non cancello modifiche fatte altrove
    try{ const sn=await docRef.get(); if(sn.exists){ S=mergeStates(JSON.parse(JSON.stringify(sn.data().state)), S); synced=snapshotMap(S) } }catch(e){}
    await docRef.set({state:JSON.parse(JSON.stringify(S)), savedAt:new Date().toISOString()}); lsSet(); setSync("salvato");
  }catch(e){
    if(e && e.code==="invalid_argument"){ readOnly=true; setSync("sola lettura") }
    else if(e && e.code==="quota_exceeded"){ setSync("spazio esaurito") }
    else setSync("salvataggio non riuscito, riprovo alla prossima modifica");
  }
  writing=false;
  if(again){ again=false; flush() }
}
async function boot(){
  const hash = (location.hash||"").slice(1);
  if(["salvati","deck","allena","tornei","pezzi","meta"].includes(hash)) tab=hash;
  const local = lsGet(); if(local){ S=normState(local); loaded=true }
  synced=snapshotMap(S);
  render();
  if(!window.claude || !window.claude.use){ setSync(STANDALONE?"salvato sul telefono":(local?"salvato su questo dispositivo":"solo su questo dispositivo")); loaded=true; render(); autoMetaNative(); return }
  try{ db = await window.claude.use("db") }catch(e){ db=null }
  if(!db){ setSync("solo su questo dispositivo"); loaded=true; render(); return }
  docRef = db.doc("app/state");
  docRef.onSnapshot(snap=>{
    if(snap.metadata && snap.metadata.hasPendingWrites) return;
    if(snap.exists){
      // i dati arrivano congelati: ne faccio una copia modificabile e la unisco alla mia
      const inc = JSON.parse(JSON.stringify(snap.data().state));
      const merged = mergeStates(inc, S);
      const changed = JSON.stringify(merged)!==JSON.stringify(S), ahead = JSON.stringify(merged)!==JSON.stringify(normState(inc));
      S = merged; synced=snapshotMap(S); lsSet(); setSync("sincronizzato");
      if(autoIntegrated()) save(); else if(ahead && !readOnly && !writing) flush();
      loaded=true;
      // non ridisegno mentre si sta scrivendo in un campo, per non perdere quello che si digita
      const a=document.activeElement; if(changed && !(a && /INPUT|TEXTAREA/.test(a.tagName) && a.type!=="checkbox")) render(); else if(!changed) {} 
      return;
    }
    setSync("archivio vuoto"); loaded=true; render();
  }, err=>{ setSync("sincronizzazione interrotta"); loaded=true; render() });
}


// ---------- Calcoli ----------
function metaMap(cat){
  const M = meta(); const list = M[cat]||[]; const max = Math.max(1,...list.map(x=>x[1]));
  const m = new Map(); list.forEach(([n,s],i)=>{ const k=normKey(n); if(!m.has(k)) m.set(k,{score: M.unit==="count" ? Math.sqrt(s/max)*100 : s/max*100, raw:s, rank:i+1}) }); return m;
}
function matchName(p){
  const list = meta()[p.type]||[]; const keys = new Map(list.map(([n])=>[normKey(n),n]));
  for(const c of [p.metaName, p.name, ALIAS[normKey(p.name)], ALIAS[normKey(p.metaName)]]){
    if(!c) continue; let k=normKey(c); k=TYPO[k]||k; if(keys.has(k)) return keys.get(k);
  }
  return "";
}
function rematchAll(){ S.parts.forEach(p=>{ p.metaName = matchName(p) }); autoIntegrated() }
// Un torneo può avere più fasi (cambi di deck): ognuna con le sue 3 combo e il suo bilancio
function phasesOf(r){
  if(Array.isArray(r.phases) && r.phases.length) return r.phases;
  let w=+r.wins||0, l=+r.losses||0;
  if(Array.isArray(r.matches) && r.matches.length){ w=r.matches.filter(m=>m.won).length; l=r.matches.length-w }
  return [{label:"Tutto il torneo", combos:r.combos||[], wins:w, losses:l}];
}
const totWL = r => phasesOf(r).reduce((a,p)=>[a[0]+(+p.wins||0), a[1]+(+p.losses||0)],[0,0]);
// Il valore salvato per una punta è la sigla (es. LR): lo riporto al nome del pezzo
function partNameFor(type,v){ if(!v) return ""; let p=S.parts.find(x=>x.type===type && (x.name===v || (type==="bit" && x.code===v)));
  if(!p){ const k=canon(ALIAS[normKey(v)]||v); p=S.parts.find(x=>x.type===type && x.metaName && canon(x.metaName)===k) }
  return p?p.name:v }
function addComboStat(st,c,w,l){
  if(!c||!c.blade) return;
  const names={blade:partNameFor("blade",c.blade), ratchet:partNameFor("ratchet",c.ratchet), bit:partNameFor("bit",c.bit)};
  for(const t of ["blade","ratchet","bit"]){ const n=names[t]; if(!n) continue; const k=t+":"+n; const o=st.get(k)||{w:0,l:0}; o.w+=w; o.l+=l; st.set(k,o) }
  const ck="combo:"+[c.blade,c.ratchet||"",c.bit||""].join("|"); const o=st.get(ck)||{w:0,l:0}; o.w+=w; o.l+=l; st.set(ck,o);
}
// withTraining: aggiunge gli scontri di allenamento, pesati per arena (per l'indice del Builder)
function personalStats(withTraining){
  const st = new Map();
  for(const r of S.results){
    for(const ph of phasesOf(r)){
      const bt=(ph.matches||[]).flatMap(m=>m.battles||[]).filter(b=>b.side!=="draw");
      if(bt.length){ bt.forEach(b=>{ const w=b.side==="me"?1:0; addComboStat(st,(ph.combos||[])[b.bey],w,1-w) }); continue }
      const w=+ph.wins||0, l=+ph.losses||0; if(!w && !l) continue;
      for(const c of (ph.combos||[])) addComboStat(st,c,w,l);
    }
  }
  if(withTraining) for(const e of (S.trainLog||[])){
    if(e.side==="draw") continue;
    const mvm=!!(e.b && e.b.mine!==false);
    const ka=trainWeight(e.arena,e.a,mvm); addComboStat(st,e.a, e.side==="a"?ka:0, e.side==="a"?0:ka);
    if(e.b && e.b.mine!==false){ const kb=trainWeight(e.arena,e.b,true); addComboStat(st,e.b, e.side==="b"?kb:0, e.side==="b"?0:kb) }
  }
  return st;
}
// Abbinamenti del meta: per ogni lama, con quali punte e ratchet arriva in top cut
const canon = s => { const x=normKey(s); return TYPO[x]||x };
function comboIndex(){
  const idx=new Map();
  for(const row of (meta().combos||[])){
    const [b,r,t,n]=row; const kb=canon(b), kr=canon(r), kt=canon(t); if(!kb||!kt) continue;
    let o=idx.get(kb); if(!o){ o={tot:0, bit:new Map(), rat:new Map(), exact:new Map(), bitName:new Map(), ratName:new Map()}; idx.set(kb,o) }
    o.tot+=n; o.bit.set(kt,(o.bit.get(kt)||0)+n); o.bitName.set(kt,o.bitName.get(kt)||t);
    if(kr){ o.rat.set(kr,(o.rat.get(kr)||0)+n); o.ratName.set(kr,o.ratName.get(kr)||r) }
    o.exact.set(kr+"|"+kt,(o.exact.get(kr+"|"+kt)||0)+n);
  }
  return idx;
}
const topOf = m => [...m.entries()].sort((a,b)=>b[1]-a[1])[0];
function ownsCanon(type,k){ return S.parts.some(p=>p.type===type && (+p.qty||0)>0 && (canon(p.metaName)===k || canon(p.name)===k)) }
function scorer(){
  const maps = {blade:metaMap("blade"), ratchet:metaMap("ratchet"), bit:metaMap("bit")};
  const st = personalStats(true); const pw = (+S.settings.personalWeight||0)/100;
  return p => {
    const hit = p.metaName ? maps[p.type].get(normKey(p.metaName)) : null;
    const m = hit ? hit.score : fallback();
    const s = st.get(p.type+":"+p.name); let pers=null, w=0;
    if(s && (s.w+s.l)>0){ const g=s.w+s.l; pers=(s.w+1)/(g+2)*100; w=pw*g/(g+4) }
    return {meta:m, metaRank:hit?hit.rank:null, pers, games:s?Math.round(s.w+s.l):0, total: pers==null?m:m*(1-w)+pers*w};
  };
}
function comboScore(b,r,t,sc,ci){
  const sb=sc(b).total, sr=r.id==="int"?55:sc(r).total, st=sc(t).total;
  let syn=0, pair=null; const why=[];
  const info = ci && b.metaName ? ci.get(canon(b.metaName)) : null;
  if(info && info.tot>=8){
    // Abbastanza dati: conta come il meta usa davvero questa lama
    const kt=canon(t.metaName||t.name), kr=canon(r.metaName||r.name);
    const bs=(info.bit.get(kt)||0)/info.tot;
    const rTot=[...info.rat.values()].reduce((a,x)=>a+x,0);
    const rs=rTot>=8 ? (info.rat.get(kr)||0)/rTot : null;
    const ex=info.exact.get(kr+"|"+kt)||0;
    syn += 18*Math.sqrt(bs) + (rs==null?4:8*Math.sqrt(rs)) + (ex>=3?5:0) - (bs===0?10:0);
    const [tb,tn]=topOf(info.bit);
    pair={share:bs, topBit:info.bitName.get(tb), topShare:tn/info.tot, topOwned:ownsCanon("bit",tb)};
    if(bs===0) why.push(`nel meta ${b.metaName} non arriva mai in top cut con ${t.metaName||t.name}: nel ${Math.round(pair.topShare*100)}% dei casi usa ${pair.topBit}`);
    else why.push(`${t.metaName||t.name} è la punta del ${Math.round(bs*100)}% dei suoi deck in top cut`);
    if(rs===0) why.push(`${r.name} non compare mai con questa lama`);
    if(ex>=3) why.push(`combo identica a una del meta (${ex} volte)`);
  } else {
    // Pochi dati sugli abbinamenti: uso il tipo di lama e punta
    syn += 6;
    if(b.kind && t.kind && b.kind===t.kind){ syn+=4; why.push("lama e punta dello stesso tipo") }
    if(b.kind==="attacco" && t.kind==="resistenza"){ syn-=5; why.push("punta lenta su lama d'attacco") }
    if(b.kind==="resistenza" && t.kind==="attacco"){ syn-=5; why.push("punta aggressiva su lama da resistenza") }
    why.push("pochi dati sugli abbinamenti di questa lama");
  }
  if(r.note && /balla|lento|rotto/i.test(r.note)){ syn-=4; why.push("ratchet segnato come difettoso") }
  syn=Math.round(syn);
  return {score: .45*sb+.25*sr+.30*st+syn, sb, sr, st, syn, why, pair};
}
function eligible(type){
  const seen=new Set();
  return S.parts.filter(p=>p.type===type && !p.avoid && (+p.qty||0)>0).filter(p=>{const k=p.name.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true});
}
// Segnaposto per le lame con ratchet integrato
const INTEGRATED = {id:"int", type:"ratchet", name:"ratchet integrato", metaName:"-", note:""};
// Lame che nel meta compaiono (quasi) sempre senza ratchet: le segno come integrate, finché l'utente non decide diversamente
function autoIntegrated(){
  const idx=comboIndex(); let changed=false;
  for(const p of S.parts){
    if(p.type!=="blade" || p.integrated!==undefined || !p.metaName) continue;
    const info=idx.get(canon(p.metaName)); if(!info || info.tot<5) continue;
    const withR=[...info.rat.values()].reduce((a,x)=>a+x,0);
    p.integrated = withR/info.tot < 0.2; changed=true;
  }
  return changed;
}
// Pezzi fissati a mano nelle tre trottole: [{blade, ratchet, bit}] con gli id dei pezzi
function slotsOf(){ const s=S.settings.slots; return Array.isArray(s)&&s.length===3 ? s : [{},{},{}] }
const anyPinned = () => slotsOf().some(x=>x&&(x.blade||x.ratchet||x.bit));
function buildDecks(){
  const B=eligible("blade"), R=eligible("ratchet"), T=eligible("bit");
  if(B.length<3||T.length<3) return {error:{B:B.length,R:R.length,T:T.length}};
  const sc=scorer(), ci=comboIndex();
  // Tutte le combo possibili lama + ratchet + punta, con il loro punteggio
  const C=[];
  B.forEach((b,bi)=>{ const rs=b.integrated?[-1]:R.map((_,i)=>i);
    rs.forEach(ri=>T.forEach((t,ti)=>{ C.push({bi,ri,ti,s:comboScore(b,ri<0?INTEGRATED:R[ri],t,sc,ci).score}) })) });
  const slots=slotsOf().map(x=>({b:B.findIndex(p=>p.id===(x&&x.blade)), r:R.findIndex(p=>p.id===(x&&x.ratchet)), t:T.findIndex(p=>p.id===(x&&x.bit))}));
  const pinned=slots.map(x=>x.b>=0||x.r>=0||x.t>=0);
  const cand=slots.map(x=>C.map((c,i)=>i).filter(i=>{const c=C[i]; return (x.b<0||c.bi===x.b)&&(x.r<0||c.ri===x.r)&&(x.t<0||c.ti===x.t)}).sort((a,b)=>C[b].s-C[a].s));
  const best=cand.map(l=>l.length?C[l[0]].s:-Infinity);
  const lim=!!S.settings.bitTypeLimit;
  const top=[]; const KEEP=400; let minTop=-Infinity;
  const push=(s,a)=>{ if(top.length>=KEEP && s<=minTop) return; top.push({s,a}); if(top.length>KEEP*1.5){ top.sort((x,y)=>y.s-x.s); top.length=KEEP; minTop=top[KEEP-1].s } };
  const pick=[0,0,0];
  function rec(k, sum, lastFree, uB, uR, uT){
    if(k===3){
      if(lim){ const ks=pick.map(i=>T[C[i].ti].kind).filter(Boolean); if(new Set(ks).size<ks.length) return }
      push(sum/3, pick.slice()); return;
    }
    let bound=0; for(let j=k+1;j<3;j++) bound+=best[j];
    for(const i of cand[k]){
      const c=C[i];
      if(top.length>=KEEP && (sum+c.s+bound)/3<=minTop) break; // le candidate sono in ordine decrescente
      if(!pinned[k] && i<=lastFree) continue;                  // evita di contare due volte lo stesso deck
      if(uB.has(c.bi) || uT.has(c.ti) || (c.ri>=0 && uR.has(c.ri))) continue;
      pick[k]=i; uB.add(c.bi); uT.add(c.ti); if(c.ri>=0) uR.add(c.ri);
      rec(k+1, sum+c.s, pinned[k]?lastFree:i, uB, uR, uT);
      uB.delete(c.bi); uT.delete(c.ti); if(c.ri>=0) uR.delete(c.ri);
    }
  }
  rec(0,0,-1,new Set(),new Set(),new Set());
  top.sort((x,y)=>y.s-x.s);
  const toDeck = t => {
    const combos=t.a.map(i=>{ const c=C[i]; const b=B[c.bi], r=c.ri<0?INTEGRATED:R[c.ri], tt=T[c.ti]; return {b,r,t:tt,...comboScore(b,r,tt,sc,ci)} });
    // Le trottole libere vanno in ordine di punteggio, quelle fissate restano al loro posto
    const free=combos.map((c,i)=>i).filter(i=>!pinned[i]); const fs=free.map(i=>combos[i]).sort((x,y)=>y.score-x.score); free.forEach((i,j)=>combos[i]=fs[j]);
    return {score:t.s, combos};
  };
  const picked=[]; const keyset=d=>new Set(d.combos.flatMap(c=>[c.b.id,c.r.id+"@"+c.b.id,c.t.id]));
  for(const t of top){ const d=toDeck(t); const ks=keyset(d);
    if(picked.every(p=>{ let same=0; ks.forEach(k=>{ if(p.ks.has(k)) same++ }); return same<=7 })){ picked.push({d,ks}); if(picked.length===12) break } }
  if(!picked.length) return {error: lim ? {rule:true} : anyPinned() ? {lock:true} : {R:R.length,B:B.length,T:T.length}};
  return {decks:picked.map(p=>p.d), sc, B, R, T};
}

  const ct=document.getElementById("cur-tab"); const cb=document.querySelector(`nav button[data-tab="${tab}"]`); if(ct&&cb) ct.textContent=cb.textContent;

}
// Le caselle prendono sempre lo stato dai dati, anche se il browser prova a ripristinarne uno vecchio
function syncChecks(){
  document.querySelectorAll('input[type="checkbox"][data-f][data-id]').forEach(el=>{ const p=S.parts.find(x=>x.id===el.dataset.id); if(p) el.checked=!!p[el.dataset.f] });

function barRow(lbl,v){ return `<div class="bar"><span>${lbl}</span><i><b style="width:${Math.max(0,Math.min(100,v)).toFixed(0)}%"></b></i><span>${v.toFixed(0)}</span></div>` }
const tourName = p => p.metaName && p.metaName!=="-" && normKey(p.metaName)!==normKey(p.name) ? p.metaName : "";
const bitLabel = t => t.code ? `${t.code} · ${t.name}` : t.name;

// Sull'arena Hasbro le combo di difesa valgono quasi zero: lì non si comportano come in torneo
function trainWeight(arena, c, mineVsMine){
  return trainWeightBase(arena,c) * (mineVsMine ? 0.5 : 1); // tra due combo mie si impara meno che contro un avversario
}
function trainWeightBase(arena, c){
  if(arena!=="hasbro") return TRAIN_WEIGHT[arena]||0.6;
  const kindOf=(type,v)=>{ const p=S.parts.find(q=>q.type===type && (q.name===v || q.code===v)); return p&&p.kind };
  return (kindOf("blade",c&&c.blade)==="difesa" || kindOf("bit",c&&c.bit)==="difesa") ? 0.03 : TRAIN_WEIGHT.hasbro;
}
function trainCur(){ if(!S.train||!S.train.cur) S.train={cur:{a:{}, b:{mine:true}, arena:"torneo"}}; return S.train.cur }
const comboKey = x => [x&&x.mine===false?"o":"m", (x&&x.blade)||"?", (x&&x.ratchet)||"?", (x&&x.bit)||"?"].join("|");

function isIntegrated(blade){ const p=S.parts.find(q=>q.type==="blade"&&q.name===blade); return !!(p&&p.integrated) }
const sameMatchup = (e,c) => comboKey({...e.a,mine:true})===comboKey({...c.a,mine:true}) && comboKey(e.b)===comboKey(c.b) && e.arena===c.arena;
function trainTally(list){ return list.reduce((t,e)=>{ if(e.side==="a"){ t.a++; t.pa+=e.pts } else if(e.side==="b"){ t.b++; t.pb+=e.pts } else t.d++; t.f[e.side+":"+e.f]=(t.f[e.side+":"+e.f]||0)+1; return t },{a:0,b:0,d:0,pa:0,pb:0,f:{}}) }

function trainClick(a,b){
  if(!a.startsWith("tr-")) return false;
  const c=trainCur(); S.trainLog=S.trainLog||[];
  if(a==="tr-arena"){ c.arena=b.dataset.k; save(); render() }
  if(a==="tr-bown"){ const m=b.dataset.mine==="1"; if((c.b.mine!==false)!==m) c.b={mine:m}; save(); render() }
  if(a==="tr-swap"){ const A={...c.a}; c.a={...c.b}; delete c.a.mine; c.b={...A, mine:true}; save(); render() }
  if(a==="tr-pt"||a==="tr-draw"){
    const side=a==="tr-draw"?"draw":b.dataset.side, f=a==="tr-draw"?"draw":b.dataset.f;
    const pts=side==="draw"?0:FINISH.find(x=>x[0]===f)[2];
    S.trainLog.push({id:uid(), t:Date.now(), a:{...c.a}, b:{...c.b}, arena:c.arena, side, f, pts});
    if(S.trainLog.length>2000) S.trainLog=S.trainLog.slice(-2000);
    save(); render();
  }
  if(a==="tr-undo"){ for(let i=S.trainLog.length-1;i>=0;i--){ if(sameMatchup(S.trainLog[i],c)){ S.trainLog.splice(i,1); break } } save(); render() }
  if(a==="tr-load"){ const e=S.trainLog.find(x=>x.id===b.dataset.t); if(e){ c.a={...e.a}; c.b={...e.b}; c.arena=e.arena; save(); render(); window.scrollTo({top:0}) } }

}
function trainChange(t){
  if(t.dataset.tr==null) return false;
  const c=trainCur(); const side=t.dataset.tr, k=t.dataset.cf;
  c[side]={...c[side], [k]:t.value.trim()};
  if(k==="blade" && side!=="b"||k==="blade"&&c.b.mine!==false){ if(isIntegrated(t.value)) c[side].ratchet="" }
  save(); render(); return true;
}

const EXITS=[["","Non indicato",""],["winner","Vincitore","1"],["final","Finale","2"],["semi","Semifinale","3-4"],["quarti","Quarti","5-8"],["ottavi","Ottavi","9-16"],["sedicesimi","Sedicesimi","17-32"],["girone","Fuori ai gironi",""],["exact","Posizione esatta",""]];
const exitInfo = k => EXITS.find(x=>x[0]===k);
const placeText = r => { const e=r.exit&&r.exit!=="exact"?exitInfo(r.exit):null; if(e) return e[2]?`${e[1]} (${e[2].replace("-","°-")}°)`:e[1]; return r.place?`${r.place}°`:"–" };
// Turno di uscita calcolato dall'eliminazione diretta: N giocatori in fase finale, k incontri vinti prima della sconfitta
function guessExit(phases, topCut){
  const ko=(phases||[]).filter(p=>p.stage==="ko").flatMap(p=>p.matches||[]);
  if(!ko.length) return "girone";
  const k=ko.filter(m=>m.won).length, lostLast=!ko[ko.length-1].won;
  if(!lostLast) return "winner";
  const left=(+topCut||16)/Math.pow(2,k);
  return {2:"final",4:"semi",8:"quarti",16:"ottavi",32:"sedicesimi"}[left]||"exact";
}
const exitSelect = (attrs, val) => `<select ${attrs} aria-label="Turno in cui sei uscito">${EXITS.map(([k,l,r])=>`<option value="${k}" ${k===(val||"")?"selected":""}>${l}${r?` (${r.replace("-","°-")}°)`:""}</option>`).join("")}</select>`;

function addBattle(side, f){
  const L=S.live, ph=livePhase(), cur=L.cur; const fin=FINISH.find(x=>x[0]===f);
  cur.battles.push({bey:cur.bey, side, f, pts: side==="draw"?0:fin[2]});
  cur.bey=(cur.bey+1)%3; // il prossimo lancio di solito è la trottola successiva nell'ordine dichiarato
  const [me,them]=matchScore(cur);
  if(me>=ph.target || them>=ph.target){
    ph.matches.push({opp:cur.opp.trim()||`Avversario ${ph.matches.length+1}`, battles:cur.battles, me, them, won:me>them});
    L.cur={opp:"", battles:[], bey:0};

  }
  save(); render();
}

function liveClick(a,b){
  const L=S.live; if(!L && a!=="lv-start") return false;
  if(a==="lv-start"){ startLive(); return true }
  if(a==="lv-bey"){ L.cur.bey=+b.dataset.i; save(); render(); return true }
  if(a==="lv-pt"){ addBattle(b.dataset.side, b.dataset.f); return true }
  if(a==="lv-draw"){ addBattle("draw","spin"); return true }
  if(a==="lv-undo"){
    if(L.cur.battles.length){ const x=L.cur.battles.pop(); L.cur.bey=x.bey }
    else { // riapro l'ultimo incontro chiuso
      const ph=livePhase(); const m=ph.matches.pop(); if(m){ const bt=m.battles||[]; const x=bt.pop(); L.cur={opp:m.opp, battles:bt, bey:x?x.bey:0} } }
    save(); render(); return true }
  if(a==="lv-forfeit"){ const ph=livePhase(); const won=b.dataset.won==="1"; const [me,them]=matchScore(L.cur);
    ph.matches.push({opp:L.cur.opp.trim()||`Avversario ${ph.matches.length+1}`, battles:L.cur.battles, me, them, won, forfeit:true});
    L.cur={opp:"",battles:[],bey:0}; save(); render(); return true }
  if(a==="lv-ko"){ const ph=livePhase(); L.phases.push(newLivePhase("ko", ph.combos)); L.cur={opp:"",battles:[],bey:0}; save(); render(); toast("Eliminazione diretta: incontri a 7 punti"); return true }
  if(a==="lv-end-ask"){ liveUI.confirm="end"; render(); return true }
  if(a==="lv-cancel-ask"){ liveUI.confirm="cancel"; render(); return true }
  if(a==="lv-no"){ liveUI.confirm=""; render(); return true }
  if(a==="lv-cancel"){ S.live=null; liveUI={confirm:"",place:"",players:"",exit:null,topCut:16}; save(); render(); toast("Torneo cancellato"); return true }
  if(a==="lv-end"){ S.results.push(liveToResult()); S.live=null; liveUI={confirm:"",place:"",players:"",exit:null,topCut:16}; save(); render(); toast("Torneo salvato nello storico"); return true }
  return false;
}
function liveChange(t){

  if(t.dataset.lv==="place"||t.dataset.lv==="players"){ liveUI[t.dataset.lv]=t.value; return true }
  if(t.dataset.lv==="topCut"){ liveUI.topCut=+t.value; liveUI.exit=null; render(); return true }

  return false;
}

function liveSetDeck(combos){
  const L=S.live, ph=livePhase();
  if(ph.matches.length===0 && L.cur.battles.length===0){ ph.combos=combos.map(c=>({...c})) }

function recompute(ctx, autoWon){
  const phs=phasesFor(ctx); if(!phs) return;
  phs.forEach(ph=>{
    (ph.matches||[]).forEach(m=>{ if((m.battles||[]).length){ const [a,b]=matchScore(m); m.me=a; m.them=b; if(autoWon && autoWon===m && a!==b) m.won=a>b } });
    if(ctx!=="live" && (ph.matches||[]).length){ const [w,l]=phaseWL(ph); ph.wins=w; ph.losses=l }
  });

function edTarget(b){ const ctx=b.dataset.ctx, pi=+b.dataset.pi, mi=b.dataset.mi!=null?+b.dataset.mi:null; const phs=phasesFor(ctx); const ph=phs&&phs[pi]; const m=ph&&mi!=null?ph.matches[mi]:null; return {ctx,pi,mi,phs,ph,m} }
function edClick(a,b){
  if(a==="hist-done"){ histEdit=null; ed=null; edDeck=null; render(); return true }
  if(!a.startsWith("ed-")) return false;
  if(a==="ed-close"){ ed=null; edConfirm=""; render(); return true }
  const T=edTarget(b); if(!T.ph) return true;
  if(a==="ed-open"){ ed={ctx:T.ctx,pi:T.pi,mi:T.mi}; edConfirm=""; render(); return true }
  if(a==="ed-deck"){ edDeck=same({ctx:T.ctx,pi:T.pi},edDeck)?null:{ctx:T.ctx,pi:T.pi}; render(); return true }
  if(a==="ed-madd"){ T.ph.matches.push({opp:"", battles:[], me:0, them:0, won:false}); ed={ctx:T.ctx,pi:T.pi,mi:T.ph.matches.length-1}; recompute(T.ctx); save(); render(); return true }
  if(a==="ed-badd" && T.m){ T.m.battles=T.m.battles||[]; T.m.battles.push({bey:T.m.battles.length%3, side:"me", f:"spin", pts:1}); recompute(T.ctx,T.m); save(); render(); return true }
  if(a==="ed-bdel" && T.m){ T.m.battles.splice(+b.dataset.bi,1); recompute(T.ctx,T.m); save(); render(); return true }
  if(a==="ed-mdel-ask"){ edConfirm=`m:${T.ctx}:${T.pi}:${T.mi}`; render(); return true }
  if(a==="ed-mdel"){ T.ph.matches.splice(T.mi,1); ed=null; edConfirm=""; recompute(T.ctx); save(); render(); toast("Incontro eliminato"); return true }
  if(a==="ed-phdel-ask"){ edConfirm=`ph:${T.ctx}:${T.pi}`; render(); return true }
  if(a==="ed-phdel"){ T.phs.splice(T.pi,1); edDeck=null; ed=null; edConfirm=""; recompute(T.ctx); save(); render(); toast("Fase eliminata"); return true }
  return true;
}
function edChange(t){
  if(t.dataset.hf){ const r=S.results.find(x=>x.id===histEdit); if(r){ r[t.dataset.hf]=t.value; if(t.dataset.hf==="exit"){ applyExit(r); render() } save() } return true }
  if(t.dataset.ctx==null) return false;
  const T=edTarget(t); if(!T.ph) return true;
  if(t.dataset.edp){ if(t.dataset.edp==="stage"){ T.ph.stage=t.value; T.ph.target=STAGE_TARGET[t.value] } else T.ph.label=t.value; save(); render(); return true }
  if(t.dataset.edc!=null){ const j=+t.dataset.edc; T.ph.combos=T.ph.combos||[{},{},{}]; T.ph.combos[j]={...(T.ph.combos[j]||{}), [t.dataset.cf]:t.value}; save(); render(); return true }
  if(!T.m) return true;
  if(t.dataset.edm==="opp"){ T.m.opp=t.value; save(); return true }
  if(t.dataset.edm==="won"){ T.m.won=t.value==="1"; recompute(T.ctx); save(); render(); return true }
  if(t.dataset.edm==="me"||t.dataset.edm==="them"){ T.m[t.dataset.edm]=Math.max(0,+t.value||0); save(); render(); return true }
  if(t.dataset.edm==="move" && t.value!==""){ const qi=+t.value; const [m]=T.ph.matches.splice(T.mi,1); T.phs[qi].matches.push(m); ed={ctx:T.ctx,pi:qi,mi:T.phs[qi].matches.length-1}; recompute(T.ctx); save(); render(); toast("Incontro spostato"); return true }
  if(t.dataset.edb!=null){ const bt=T.m.battles[+t.dataset.edb]; const k=t.dataset.k;
    if(k==="bey") bt.bey=+t.value; else if(k==="side"){ bt.side=t.value; if(t.value==="draw") bt.pts=0; else bt.pts=(FINISH.find(x=>x[0]===bt.f)||FINISH[0])[2] } else if(k==="f"){ bt.f=t.value; bt.pts=FINISH.find(x=>x[0]===t.value)[2] }
    recompute(T.ctx,T.m); save(); render(); return true }
  return true;
}

function parseMetaText(txt){
  const L=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const map={"LOCK CHIP":"lockchip","RATCHET":"ratchet","BLADE":"blade","OVER BLADE":"overblade","ASSIST BLADE":"assist","BIT":"bit"};
  const out={blade:[],ratchet:[],bit:[],lockchip:[],overblade:[],assist:[]}; let cur=null; const seen={};
  for(let i=0;i<L.length;i++){
    const up=L[i].toUpperCase();
    if(map[up]){ cur=map[up]; if(seen[cur]) cur="__dup"; else seen[cur]=1; continue }
    if(/^#\d+/.test(L[i]) && cur && cur!=="__dup"){
      const name=L[i+1], score=parseFloat(L[i+2]);
      if(name && !isNaN(score)){ out[cur].push([name,score]); i+=2 }
    }
    if(/^Week ID$/i.test(L[i])) out.week=L[i+1];
    if(/^Start Date$/i.test(L[i])) out.start=L[i+1];
    if(/^End Date$/i.test(L[i])) out.end=L[i+1];
    if(/^Event Scanned$/i.test(L[i])) out.events=+L[i+1];
    if(/^Parts Analyzed$/i.test(L[i])) out.partsAnalyzed=+L[i+1];
  }
  return out;
}

function parseLeaderboard(t){
  const L=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  let i=L.findIndex(l=>/^#\s*Item/i.test(l)); if(i<0) return {rows:[],total:null};
  const k=L.findIndex(l=>/^Top-cut appearances$/i.test(l)); const total=k>0?parseInt(L[k-1],10)||null:null;
  const rows=[];
  for(i=i+1;i<L.length-2;i++){
    if(/^Showing/i.test(L[i])) break;
    if(/^\d+$/.test(L[i]) && !/^\d+$/.test(L[i+1]) && /^\d+$/.test(L[i+2])){ rows.push([L[i+1], +L[i+2]]); i+=2 }
  }
  return {rows,total};
}
// Classifica combo: rango, lama, "ratchet • punta", apparizioni
function parseComboBoard(t){
  const L=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  let i=L.findIndex(l=>/^#\s*Item/i.test(l)); if(i<0) return [];
  const rows=[];
  for(i=i+1;i<L.length-3;i++){
    if(/^Showing/i.test(L[i])) break;
    const m=L[i+2].match(/^(.*?)\s*•\s*(.+)$/);
    if(/^\d+$/.test(L[i]) && m && /^\d+$/.test(L[i+3])){ rows.push([L[i+1], m[1].trim()||"-", m[2].trim(), +L[i+3]]); i+=3 }
  }
  const acc=new Map();
  for(const [b,r,p,n] of rows){ const k=[canon(b),canon(r),canon(p)].join("|"); const o=acc.get(k); if(o) o[3]+=n; else acc.set(k,[b,r,p,n]) }
  return [...acc.values()].sort((a,b)=>b[3]-a[3]);
}
function mergeRows(rows){
  const m=new Map();
  for(const [n,c] of rows){ let k=normKey(n); k=TYPO[k]||k; if(!k) continue; const o=m.get(k); if(o){ o.c+=c; if(c>o.best){ o.best=c; o.n=n } } else m.set(k,{n,c,best:c}) }
  return [...m.values()].sort((a,b)=>b.c-a.c).map(o=>[o.n,o.c]);
}

// Classifiche calcolate dai dati grezzi dei tornei MetaBeys: apparizioni in top cut per lama, ratchet, punta e combo
function metaFromEvents(events, days){
  const from = days ? new Date(Date.now()-days*864e5).toISOString().slice(0,16) : "";
  const ev = events.filter(e=>e && e.topCut && e.topCut.length && (!from || String(e.startTime||"")>=from));
  const disp=new Map(); const name=(k,s)=>{ if(!disp.has(k)) disp.set(k,String(s).trim()); return disp.get(k) };
  const cnt={blade:new Map(), ratchet:new Map(), bit:new Map()}, combos=new Map(); let total=0;
  const add=(m,k)=>m.set(k,(m.get(k)||0)+1);
  for(const e of ev) for(const pl of e.topCut) for(const c of (pl.combos||[])){
    if(!c || !c.blade) continue; total++;
    const kb=canon(c.blade), kr=canon(c.ratchet||"-"), kt=canon(c.bit||"");
    name("b:"+kb,c.blade); if(kr) name("r:"+kr,c.ratchet); if(kt) name("t:"+kt,c.bit);
    add(cnt.blade,kb); if(kr) add(cnt.ratchet,kr); if(kt) add(cnt.bit,kt);
    if(kt) add(combos,[kb,kr,kt].join("|"));
  }
  const list=(m,p)=>[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([k,n])=>[disp.get(p+":"+k)||k,n]);
  return {source:"MetaBeys", unit:"count", fetchedAt:new Date().toISOString(), appearances:total, events:ev.length,
    blade:list(cnt.blade,"b"), ratchet:list(cnt.ratchet,"r"), bit:list(cnt.bit,"t"),
    combos:[...combos.entries()].filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{ const [b,r,t]=k.split("|"); return [disp.get("b:"+b)||b, r?(disp.get("r:"+r)||r):"-", disp.get("t:"+t)||t, n] })};
}

// ---------- Lettura delle classifiche di Challonge (senza Claude) ----------
// L = righe di testo della pagina "Classifiche" di un torneo; user = nome utente Challonge
const EN_MONTHS={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function parseStandingsLines(L, user, title){
  // le celle possono arrivare su righe separate o sulla stessa riga separate da tabulazioni
  L=L.flatMap(x=>String(x).split(/\t+/)).map(x=>x.replace(/\u00a0/g," ").trim()).filter(Boolean);
  const u=String(user||"").toLowerCase(); const isU=s=>{ const x=String(s||"").toLowerCase().replace(/^\(|\)$/g,"").trim(); return u && x===u };
  const out={event:String(title||"").replace(/\s+/g," ").replace(/\s*[-–]\s*(Classifiche|Standings|Challonge)[\s\S]*$/i,"").trim(), date:null, players:null, final:null, group:null};
  const all=L.join("\n"); const pm=all.match(/Giocatori\s+(\d+)/); if(pm) out.players=+pm[1];
  for(let i=0;i<L.length;i++){ const m=L[i].match(/^([A-Z][a-z]+) (\d{1,2}), (\d{4})/); if(m && EN_MONTHS[m[1].toLowerCase()]){ out.date=`${m[3]}-${String(EN_MONTHS[m[1].toLowerCase()]).padStart(2,"0")}-${m[2].padStart(2,"0")}`; break } }
  // fase finale: Rango / Nome partecipante / Utente Challonge / Storia Partita, poi righe rango, nome, utente, W/L
  let k=-1; for(let i=0;i<L.length-1;i++) if(L[i]==="Rango" && /^Nome partecipante/.test(L[i+1])){ k=i; break }
  const gStart=L.findIndex((x,i)=>i>k && /^Gruppo /.test(x));
  if(k>=0){
    const end=gStart>k?gStart:L.length; let i=k+1; while(i<end && !/^\d+$/.test(L[i])) i++;
    const rows=[];
    while(i<end){ if(/^\d+$/.test(L[i])){ const r={rank:+L[i], name:L[i+1], user:L[i+2], w:0, l:0}; let j=i+3; while(j<end && /^[WL]$/.test(L[j])){ L[j]==="W"?r.w++:r.l++; j++ } rows.push(r); i=j } else i++ }
    const me=rows.find(r=>isU(r.name)||isU(r.user)); if(me) out.final={...me, size:rows.length}; else if(rows.length) out.finalSize=rows.length;
  }
  // gironi: cerco il mio nome nella sezione di ogni gruppo
  for(let i=0;i<L.length;i++){
    if(!/^Gruppo /.test(L[i])) continue;
    const g=L[i].replace(/^Gruppo\s*/,""); let end=L.findIndex((x,j)=>j>i && /^Gruppo /.test(x)); if(end<0) end=L.length;
    const sec=L.slice(i,end);
    const ni=sec.findIndex(x=>isU(x) || isU(x.replace(/^Avanzate\s+/,"").replace(/\s*\(.*\)$/,"")) || (x.match(/\(([^)]+)\)$/)&&isU(x.match(/\(([^)]+)\)$/)[1])));
    if(ni<0) continue;
    let rank=null; for(let j=ni-1;j>=0;j--){ if(/^\d+$/.test(sec[j])){ rank=+sec[j]; break } }
    let wl=null; for(let j=ni;j<sec.length;j++){ const m=sec[j].match(/^(\d+) - (\d+) - (\d+)$/); if(m){ wl=[+m[1],+m[2],+m[3]]; break } }
    const size=sec.filter(x=>/^\d+ - \d+ - \d+$/.test(x)).length;
    out.group={name:g, rank, size, w:wl?wl[0]:0, l:wl?wl[1]:0};
    break;
  }
  return out;
}
const RANK_EXIT = r => r===1?"winner": r===2?"final": r<=4?"semi": r<=8?"quarti": r<=16?"ottavi": r<=32?"sedicesimi": "exact";
// Dal risultato letto al modulo del torneo, tenendo il deck già inserito
function standingsToForm(P, link){
  if(!P.group && !P.final) return false;

  const phases=[];
  if(P.group) phases.push({...blankPhase("Girone", keepCombos), stage:"girone", wins:P.group.w, losses:P.group.l});
  if(P.final) phases.push({...blankPhase("Eliminazione diretta", keepCombos), stage:"ko", wins:P.final.w, losses:P.final.l});
  const exit = P.final ? RANK_EXIT(P.final.rank) : "girone";

    notes: P.group ? `Girone ${P.group.name}${P.group.rank?`, ${P.group.rank}°${P.group.size?` su ${P.group.size}`:""}`:""}` : "", matches:[], phases};
  const wl=phases.reduce((a,p)=>[a[0]+p.wins,a[1]+p.losses],[0,0]);

function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600) }
const partById=id=>S.parts.find(p=>p.id===id);

function setMenu(open){ const m=document.getElementById("menu"), bt=document.getElementById("burger"); m.hidden=!open; bt.setAttribute("aria-expanded",String(open)); if(open){ const cur=m.querySelector('[aria-selected="true"]')||m.querySelector("button"); cur&&cur.focus() } }
document.getElementById("burger").addEventListener("click",()=>setMenu(document.getElementById("menu").hidden));
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]"); if(!b) return; tab=b.dataset.tab; aiError=""; setMenu(false); render(); window.scrollTo({top:0})});
document.addEventListener("click",e=>{ if(!document.getElementById("menu").hidden && !e.target.closest("header")) setMenu(false) });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !document.getElementById("menu").hidden){ setMenu(false); document.getElementById("burger").focus() } });
document.getElementById("main").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.deckname){ const d=S.decks.find(x=>x.id===t.dataset.deckname); if(d){ d.name=t.value.trim()||d.name; save(); toast("Nome del deck salvato") } return }
  if(t.id==="bk-file"){ if(t.files&&t.files[0]) importData(t.files[0]); t.value=""; return }
  if(trainChange(t)) return;
  if(edChange(t)) return;
  if(liveChange(t)) return;
  if(t.dataset.f && t.dataset.id){ const p=partById(t.dataset.id); if(!p) return;
    if(["avoid","integrated","left"].includes(t.dataset.f)) p[t.dataset.f]=t.checked; else if(t.dataset.f==="qty") p.qty=Math.max(0,+t.value||0); else p[t.dataset.f]=t.value.trim();
    save(); render(); return }
  if(t.id==="rule-bit"){ S.settings.bitTypeLimit=t.checked; aiResult=null; save(); render() }
  if(t.id==="pw"){ S.settings.personalWeight=+t.value; save(); render() }
  if(t.id==="ch-user"){ S.settings.challonge=t.value.trim(); save(); render() }
  if(t.dataset.slot!=null && t.dataset.stype){ const sl=slotsOf().map(x=>({...(x||{})})); const i=+t.dataset.slot, k=t.dataset.stype;
    // lo stesso pezzo non può stare in due trottole
    sl.forEach((x,j)=>{ if(j!==i && x[k]===t.value) delete x[k] });
    // chi resta nella trottola senza essere fissato viene ricalcolato
    sl[i][k]=t.value; const part=S.parts.find(p=>p.id===t.value);
    if(k==="blade" && part && part.integrated) delete sl[i].ratchet;
    S.settings.slots=sl; viewIdx=0; aiResult=null; save(); render() }
  // Modulo torneo: i campi delle fasi aggiornano la bozza senza ridisegnare
  if(form && t.dataset.ph!=null){ const ph=form.phases[+t.dataset.ph]; if(!ph) return;
    if(t.dataset.cf){ ph.combos[+t.dataset.cj]=Object.assign({}, ph.combos[+t.dataset.cj], {[t.dataset.cf]:t.value}) }
    else if(t.dataset.pf){ ph[t.dataset.pf]=t.dataset.pf==="label"?t.value:(t.value===""?"":Math.max(0,+t.value||0)) }
    return }
  if(form && t.dataset.fill!=null && t.value){ syncFormTop(); const ph=form.phases[+t.dataset.fill];
    const d = t.value==="best" ? (buildDecks().decks||[])[0] : S.decks.find(x=>x.id===t.value);
    if(ph && d){ ph.combos=deckCombos(d) } render() }
});
document.getElementById("main").addEventListener("input",e=>{ if(e.target.id==="ai-q") chatDraft=e.target.value; if(e.target.id==="pw"){ const v=document.getElementById("pw-val"); if(v) v.textContent=e.target.value+"%" } });
document.getElementById("main").addEventListener("keydown",e=>{ if(e.target.id==="ai-q" && e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); sendChat() } });
document.getElementById("main").addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="chat-form"){ sendChat(); return }
  if(e.target.id==="add-part"){
    const type=document.getElementById("np-type").value, name=document.getElementById("np-name").value.trim(), code=document.getElementById("np-code").value.trim();
    if(!name) return;
    const existing=S.parts.find(p=>p.type===type && p.name.toLowerCase()===name.toLowerCase());
    if(existing){ existing.qty=(+existing.qty||0)+1; toast(`${name}: ora ne hai ${existing.qty}`) }
    else { const names=(meta()[type]||[]).map(x=>x[0]); const m=names.find(n=>n.toLowerCase()===name.toLowerCase())||"";
      S.parts.push({id:uid(),type,name,code:type==="bit"?code:"",metaName:m,kind:"",qty:1,avoid:false,note:""}); toast(`${TYPE_LABEL[type]} aggiunta: ${name}`) }
    save(); render(); return;
  }
  if(e.target.id==="res-form"){
    syncFormTop(); const f=form||newForm();
    const phases=f.phases.map((p,i)=>({label:(p.label||"").trim()||(f.phases.length>1?`Deck ${i+1}`:"Tutto il torneo"), combos:[0,1,2].map(j=>{const c=(p.combos||[])[j]||{}; return {blade:c.blade||"",ratchet:c.ratchet||"",bit:c.bit||""}}), wins:+p.wins||0, losses:+p.losses||0, ...(p.stage?{stage:p.stage}:{})}));
    const r={id:f.id||uid(), link:f.link||"", date:f.date, event:(f.event||"").trim(), place:f.place, exit:f.exit||(f.place?"exact":""), ...(f.topCut?{topCut:f.topCut}:{}), players:f.players, notes:(f.notes||"").trim(), matches:f.matches||[], phases};
    if(!r.event){ toast("Scrivi il nome dell'evento"); return }
    if(r.exit && r.exit!=="exact" && !(f.place && /^\d+$/.test(f.place) && r.exit==="exact")) applyExit(r);
    if(f.mode==="edit"){ const i=S.results.findIndex(x=>x.id===r.id); if(i>=0) S.results[i]=r; else S.results.push(r) } else S.results.push(r);
    form=null; save(); render(); toast(f.mode==="edit"?"Modifiche salvate":"Torneo registrato");
  }
});
document.getElementById("main").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="open-perms"){ (async()=>{ try{ const perm=await window.claude.use("permissions"); await perm.manage(); const st=await perm.state("mcp:"+BR); browserDenied=st==="denied"; if(!browserDenied){ chMsg=chMsg&&"Permesso aggiornato: riprova."; metaMsg=metaMsg&&"Permesso aggiornato: riprova." } }catch(e){ toast("Apri il menu dell'app (in alto), poi Permessi") } render() })(); return }
  if(trainClick(a,b)) return;
  if(a==="go-builder"){ tab="deck"; render(); window.scrollTo({top:0}); return }
  if(a==="fold"){ fold[b.dataset.key]=!fold[b.dataset.key]; try{ localStorage.setItem("decklab-fold",JSON.stringify(fold)) }catch(e){} render(); return }
  if(a==="hist-toggle"){ histOpen=histOpen===b.dataset.id?null:b.dataset.id; edConfirm=""; render(); return }
  if(a==="hist-del-ask"){ edConfirm="r:"+b.dataset.id; render(); return }
  if(a==="hist-nodel"){ edConfirm=""; render(); return }
  if(edClick(a,b)) return;
  if(a.startsWith("lv-")){ liveClick(a,b); return }
  if(a==="del-part"){ S.parts=S.parts.filter(p=>p.id!==b.dataset.id); save(); render() }
  if(a==="save-deck"){ const d=(window.__decks||[])[+b.dataset.i]; if(!d) return;
    S.decks.unshift({id:uid(),name:`${d.combos.map(c=>c.b.name.split(" ")[0]).join(" / ")} · ${new Date().toLocaleDateString("it-IT")}`,date:new Date().toISOString().slice(0,10),score:d.score,combos:d.combos.map(c=>({blade:c.b.name,ratchet:c.r.id==="int"?"":c.r.name,bit:c.t.name,bitCode:c.t.code||""}))});
    save(); render(); toast("Deck salvato nella sezione Deck") }
  if(a==="chat-stop"){ if(chatCtl) chatCtl.abort() }
  if(a==="chat-clear"){ chat=[]; chatErr=""; render() }
  if(a==="prev-deck"){ viewIdx=Math.max(0,viewIdx-1); aiResult=null; render() }
  if(a==="next-deck"){ viewIdx++; aiResult=null; render() }
  if(a==="show-deck"){ viewIdx=+b.dataset.i; aiResult=null; render(); window.scrollTo({top:0}) }
  if(a==="unpin"){ const sl=slotsOf().map(x=>({...(x||{})})); delete sl[+b.dataset.slot][b.dataset.stype]; S.settings.slots=sl; viewIdx=0; save(); render() }
  if(a==="unpin-all"){ S.settings.slots=[{},{},{}]; viewIdx=0; save(); render() }
  if(a==="use-deck"||a==="use-saved"){
    const d = a==="use-deck" ? (window.__decks||[])[+b.dataset.i] : S.decks.find(x=>x.id===b.dataset.id); if(!d) return;
    if(S.live){ tab="tornei"; liveSetDeck(deckCombos(d)); window.scrollTo({top:0}); return }
    if(!form || form.mode==="edit") form=newForm();
    form.phases[form.phases.length-1].combos=deckCombos(d);
    tab="tornei"; render(); window.scrollTo({top:0}); toast("Deck inserito nel modulo del torneo") }
  if(a==="ph-add"){ syncFormTop(); if(!form) form=newForm(); const last=form.phases[form.phases.length-1];
    if(form.phases.length===1 && last.label==="Tutto il torneo") last.label="Prima del cambio";
    form.phases.push(blankPhase(`Dopo il cambio${form.phases.length>1?" "+form.phases.length:""}`, last.combos)); render() }
  if(a==="ph-del"){ syncFormTop(); form.phases.splice(+b.dataset.i,1); if(form.phases.length===1) form.phases[0].label="Tutto il torneo"; render() }
  if(a==="del-deck"){ S.decks=S.decks.filter(d=>d.id!==b.dataset.id); save(); render() }
  if(a==="ask-ai") askAI();
  if(a==="import-meta") importMeta();
  if(a==="reset-meta"){ S.meta=null; rematchAll(); metaMsg=""; save(); render(); toast("Ripristinati i dati di partenza") }
  if(a==="mb-update") updateFromMetaBeys();
  if(a==="import-ch") importChallonge();
  if(a==="ch-find"){ STANDALONE?findMyTournamentsNative():findMyTournaments() }
  if(a==="ch-link"){ const v=(document.getElementById("ch-link")||{}).value; STANDALONE?importFromLinkNative(v):importFromLink(v) }
  if(a==="ch-import"){ const t=(chList||[])[+b.dataset.i]; if(t) (STANDALONE?importFromLinkNative:importFromLink)(t.url) }
  if(a==="mb-native") updateMetaNative();
  if(a==="bk-export") exportData();
  if(a==="cancel-res"){ form=null; chMsg=""; render() }
  if(a==="edit-res"){ const r=S.results.find(x=>x.id===b.dataset.id); if(!r) return;
    if((r.phases||[]).some(p=>(p.matches||[]).length)){ histEdit=r.id; ed=null; edDeck=null; render(); window.scrollTo({top:0}); return }
    const c=JSON.parse(JSON.stringify(r));
    form={mode:"edit", ...c, phases:JSON.parse(JSON.stringify(phasesOf(r)))}; render(); window.scrollTo({top:0}) }
  if(a==="del-res"){ S.results=S.results.filter(r=>r.id!==b.dataset.id); edConfirm=""; histOpen=null; save(); render(); toast("Torneo eliminato") }
});
boot();
</script>
